name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server in background
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start in time"
          cat server.log
          exit 1

      - name: Run demo (exercises cache + routing)
        run: npm run demo

      - name: Assert savings in /stats
        run: |
          node -e "
            const s = require('child_process')
              .execSync('curl -fsS http://localhost:3000/stats', { encoding: 'utf8' });
            const stats = JSON.parse(s);
            console.log(JSON.stringify(stats.cost, null, 2));
            console.log(JSON.stringify(stats.cache, null, 2));
            if (stats.requests < 10) throw new Error('expected at least 10 demo requests, got ' + stats.requests);
            if (stats.cache.hits < 3) throw new Error('expected at least 3 cache hits, got ' + stats.cache.hits);
            if (stats.cache.semanticHits < 1) throw new Error('expected at least 1 semantic hit, got ' + stats.cache.semanticHits);
            if (!(stats.cost.saved > 0)) throw new Error('expected dollars saved > 0, got ' + stats.cost.saved);
            if (!(stats.cost.savingsPct > 0)) throw new Error('expected savingsPct > 0, got ' + stats.cost.savingsPct);
            console.log('ASSERTIONS PASSED: cache hits + dollars saved confirmed.');
          "

      - name: Stop server
        if: always()
        run: |
          kill $(cat server.pid) || true
          cat server.log || true
